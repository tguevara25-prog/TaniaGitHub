<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de deseos</title>
</head>
<body>
  <h1>Lista de deseos</h1>
  <p>Cosas que quiero</p>
  <input type="text" id="deseo" placeholder="Deseo espectacular">
  <button id="btnAñadir">Añadir deseo</button>
  <button id="btnUrgente">Urgente</button>

  <h2>Busca tu deseo</h2>
  <input type="text" id="busqueda" placeholder="¿Qué estás buscando?">
  <button id="btnBuscar">Buscar</button>

  <h2>Edita tu deseo</h2>
  <input type="text" id="origen" placeholder="¿Qué quieres cambiar?">
  <input type="text" id="nuevo" placeholder="¿Cómo quieres que sea?">
  <button id="btnEditar">Editar</button>

  <p id="mensajes"></p>
  <ul id="lista"></ul>

  <script src="deseos.js"></script>
</body>
</html>
